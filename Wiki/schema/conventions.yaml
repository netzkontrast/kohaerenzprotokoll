# Naming, ownership, log grammar and process constants of the research wiki.
version: 1

navigation:
  entrypoint: Wiki/index.md
  local_index: README.md
  local_index_policy: every content root and every occupied partition has a rendered README.md
  root_index_policy: list every allowed named partition, including empty partitions, with page counts
  page_rule: one semantic entity or one focused question per page
  split_rule: split at a stable semantic boundary before max_words; connect the pages with wiki links
  directory_depth: exactly one partition below the page-kind directory
  partitions:
    sources: category
    concepts: kind_detail
    questions: axis
    syntheses: filed year (YYYY)
    candidates: kind, then the same partition used by the promoted page

context_loading:
  router: Wiki/context-map.md
  order: [context map, matching page sections, cited source lines]
  default_source_loading: never load a full raw source when a cited range answers the question
  safe_for_chapter: spoiler_until must be less than or equal to the target chapter
  unknown_spoiler_default: 40
  summary_max_words: 40

slug:
  pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  max_length: 60
  source_slugs: from Sources/manifest.jsonl (scripts/source_inventory.py), never re-derived

language:
  quotes_and_canon_facing_prose: de      # never translated
  summaries_explanations_engineering: en
  page_titles: as in the source

ownership:
  user_owned:                     # write-denied for the agent; only the author changes them
    - Sources/**
    - Canon/**
    - ncp.json
    - ncp-b.json
  tools_only:                     # rendered or written by scripts, never by hand
    - Wiki/graph/**
    - Wiki/index.md
    - Wiki/concept-table.md
    - Wiki/context-map.md
    - Wiki/sources/**/README.md
    - Wiki/concepts/**/README.md
    - Wiki/questions/**/README.md
    - Wiki/syntheses/**/README.md
    - Wiki/candidates/**/README.md
    - Codex/GLOSSARY.md
    - Codex/MASTER-TIMELINE.md
    - Codex/WORLD-AXIOMS.md
  append_only:
    - Wiki/log.md
  candidates: Wiki/candidates     # LLM output waits here for /wiki-promote
  terminal:                       # receive links, write no reverse, are never auto-created
    - Canon/
    - Codex/

# "the graph" in every document of this repo means the provenance graph in
# Graph/. Wiki/graph/edges.jsonl is the wiki's relation index (D-W2).
graph:
  provenance: Graph/
  wiki_relation_index: Wiki/graph/edges.jsonl
  page_bodies_in_provenance_graph: never       # lint rule no-page-body-in-graph
  claims_in_provenance_graph: a NovelClaim record with source_uri under Sources/ or Canon/, never Wiki/

log:
  file: Wiki/log.md
  grammar: "## [YYYY-MM-DD] <op> | <title> | skill=<command or program> | sha256=<content hash when a page was written>"
  ops: [ingest, promote, understand, question, clarify, tetraframe, query, lint, health, claim]
  claim_events: [created, reinforced, challenged, superseded, resolved]   # quicky-wiki epistemic events, one line each

batches:
  ingest_size: 25                 # merge and lint run once per batch, not per source (llm-tldr)
  candidate_max_age_days: 30      # lint rule candidate-age warns beyond this

promotion:
  command: /wiki-promote
  pin: sha256 of the reviewed body, recorded in the log line; a changed hash refuses promotion
  requires_clear_clarify_verdict_for: [/promote-to-canon]
  requires_tetraframe_for: [merge, supersede, delete, contradicts-canon, storyform, axiom]

canon_verification:               # D-W12
  initial_canon_status: unverified
  conflict_default_winner: none   # a Canon/research conflict is an open question
  manuscript_work: Canon stays normative
