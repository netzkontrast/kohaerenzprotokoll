# CausalLinks — what one thing brings about, allows, prevents or triggers in another, each with that sentence.
#
# provisional — first design, 2026-09-30; never run on the corpus
# derived from: the plot model GOAL.md wants as checkable rules, and the questions of the kind why does X happen that no stated relation
#   type answers: StatedRelations types are open and mostly structural (part_of, controls, located_in).
# measured against: the causal chains a note quotes for the same document; a pair whose endpoints both resolve to a wiki term is the attachable subset. A quote is placed by read.py --find (P26).
# may not: say that a cause is true, order events in time, or detect a contradiction between two documents' causes — a cause is a P_HE_CAUSAL proposal for a reader
# retire when: on three documents a person keeps no pair beyond what StatedRelations already gives as causes or controls
language: en
name: CausalLinks
type: list
tags: [causality, mechanism, plot, german]
description: "What one thing brings about, allows, prevents or triggers in another, each with that sentence, each copied from one German document."

output:
  description: "One record per sentence that states it."
  fields:
    - name: source
      type: str
      description: "The cause, the condition or the trigger, as a short noun phrase exactly as the document writes it."
      required: true
    - name: target
      type: str
      description: "The effect, the result or the thing affected, as a short noun phrase exactly as the document writes it."
      required: true
    - name: type
      type: str
      description: "causes: the sentence says one produces the other. enables: it makes the other possible. prevents: it stops or blocks the other. triggers: it sets the other off at a moment. requires: the other cannot happen without it."
      required: true
    - name: quote
      type: str
      description: "Exact contiguous words from ONE source line, containing BOTH names; no ellipsis, joined lines or translation. Prefer a shorter fragment if a sentence wraps."
      required: true
    - name: stance
      type: str
      description: "asserts: states it as so. hedges: qualifies it as possible or provisional. denies: says it is not so. asks: poses it as a question. cites: reports what an outside source says."
      required: true

guideline:
  target: "You read one German research document and collect, verbatim, the sentences in which it says that one thing brings about, allows, prevents or triggers another, so that a person can follow the document's mechanisms."
  rules:
    - "Record a pair only when ONE sentence states the causal step itself: führt zu, verursacht, löst aus, ermöglicht, verhindert, weil, daher, dadurch, infolgedessen, erzwingt, setzt voraus."
    - "Both endpoints are short noun phrases of at most six words that stand inside the quote; never a whole clause."
    - "A cause the document hedges (könnte, möglicherweise) is recorded with stance hedges; a denied cause (führt nicht zu) with stance denies."
    - "A cause the document attributes to an outside theory is recorded with stance cites."
    - "Never infer a cause from order of sentences, from proximity, or from background knowledge; never chain two sentences into one pair."
    - "When the words do not state the causal step, omit the record rather than fabricate evidence."

options:
  fields_for_search: [source, target, quote]

display:
  label: '{source} — {type} — {target}'
