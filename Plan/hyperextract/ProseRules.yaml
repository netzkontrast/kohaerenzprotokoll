# ProseRules — a rule for how the book is written — voice, diction, device, lock, formatting, ban — with its scope and the sentence.
#
# provisional — first design, 2026-09-30; never run on the corpus
# derived from: the plan's rulebook (Phase 2d: the prose rules the author keeps, each with its chapter range and a mark for whether code can check it), GOAL.md 5.4's
#   discipline table and the drafting brief's R-1 to R-10, all of which count as proposals; and writing-skills rule 4: a designed crack is not a slip,
#   so the line-editor, copy-editor and continuity-editor each take a list of pre-cleared devices from the rulebook, and until it exists ask the author.
# measured against: the rulebook once the author has decided it; until then, a rule whose subject and constraint stand inside its quote is the precise subset. A quote is placed by read.py --find (P26).
# may not: clear a device, keep a rule or say a rule is decided — the rulebook is the author's; a rule here is a P_HE_PROSERULE proposal; nor write a line of prose to show a rule
# retire when: on three documents the author's rulebook keeps no rule offered
language: en
name: ProseRules
type: list
tags: [rulebook, style, devices, voice, german]
description: "A rule for how the book is written — voice, diction, device, lock, formatting, ban — with its scope and the sentence, each copied from one German document."

output:
  description: "One record per sentence that states it."
  fields:
    - name: source
      type: str
      description: "What the rule governs, as the source writes it: a world, a voice, a chapter range, a figure, a kind of sentence."
      required: true
    - name: target
      type: str
      description: "The rule itself as a short phrase exactly as the source writes it."
      required: true
    - name: type
      type: str
      description: "voice: how a narrating voice sounds or shifts. diction: a word, a register or a ban on a kind of word or image. device: a designed effect that must not be read as a slip (a mosaic break, an unreliable or plural narrator, a contradictory note, an unlabelled voice). lock: a sentence or wording the source calls fixed. format: a typographic rule (capital letters, italics, a log form). number: numbers or counting as voice. structure: a rule for scenes, chapters or reveals. pov: person, tense or point of view."
      required: true
    - name: quote
      type: str
      description: "Exact contiguous words from ONE source line, containing BOTH names; no ellipsis, joined lines or translation. Prefer a shorter fragment if a sentence wraps."
      required: true
    - name: stance
      type: str
      description: "asserts: states it as so. hedges: qualifies it as possible or provisional. denies: says it is not so. asks: poses it as a question. cites: reports what an outside source says."
      required: true

guideline:
  target: "You read one German document about how a novel is to be written and collect, verbatim, the sentences that state a rule of the prose, so that a person can decide what goes into the book's rulebook."
  rules:
    - "Record a rule only when ONE sentence states it as binding or as a chosen device: nie, keine, immer, muss, verboten, gelockt, Lock, Regel, Prosa-Regel, bewusst, absichtlich, designt, Stilcode, Metaphernverbot."
    - "The governed thing and the rule both stand inside the quote; the scope and the lock date are copied as written or left empty."
    - "A device is a designed effect the source says is deliberate; a slip the source calls an error is not a device."
    - "A rule a source marks as disputed, open or proposed is recorded with stance hedges; a rule it withdraws with stance denies."
    - "Never infer a rule from how a sentence is written, or from what a chapter does; the rule must be stated."
    - "When the words do not state a rule, omit the record rather than fabricate evidence."

options:
  fields_for_search: [source, target, quote]

display:
  label: '{source} — {type} — {target}'
