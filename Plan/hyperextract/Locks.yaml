# Locks — a decision a source records as fixed, with its date and the sentence.
#
# provisional — first design, 2026-09-30; never run on the corpus
# derived from: GOAL.md 4.2's claim schema (`lock: {locked, date, source}`) and the rules table (each with a lock date): the sources say which decisions were fixed on which day, and
#   the record C11 on heat and ozone shows the risk of applying one. The censuses note locks by hand.
# measured against: the wiki's conflict and question records that carry a dated decision; a record whose subject and date stand inside its quote is the precise subset. A quote is placed by read.py --find (P26).
# may not: treat a source's lock as the author's decision — the author's decisions are the records with status decided (writing-skills rule 2) — or say a lock holds; a lock here is a P_HE_LOCK claim about a source
# retire when: on three documents a person keeps no lock beyond what the records already carry
language: en
name: Locks
type: list
tags: [locks, decisions, dates, german]
description: "A decision a source records as fixed, with its date and the sentence, each copied from one German document."

output:
  description: "One record per sentence that states it."
  fields:
    - name: source
      type: str
      description: "What is locked, exactly as the source writes it: a rule, a name, a structure, a wording."
      required: true
    - name: target
      type: str
      description: "The date or label of the lock exactly as the source writes it."
      required: true
    - name: type
      type: str
      description: "locked: the source records it as fixed. unlocked: it records the lock as lifted. contested: it records the lock as disputed. superseded_lock: a later lock replaces it."
      required: true
    - name: quote
      type: str
      description: "Exact contiguous words from ONE source line, containing BOTH names; no ellipsis, joined lines or translation. Prefer a shorter fragment if a sentence wraps."
      required: true
    - name: stance
      type: str
      description: "asserts: states it as so. hedges: qualifies it as possible or provisional. denies: says it is not so. asks: poses it as a question. cites: reports what an outside source says."
      required: true

guideline:
  target: "You read one German document and collect, verbatim, the sentences that record a decision as fixed on a date, so that a person can see which locks the sources claim."
  rules:
    - "Record a lock only when ONE sentence says something is fixed: Lock, gelockt, Lock-In, fixiert, festgelegt, beschlossen, Entscheidung vom, Stand."
    - "The locked thing and the date or label both stand inside the quote."
    - "A lock the source attributes to someone else is recorded with stance cites."
    - "Never infer a lock from a date in a heading or a title."
    - "When the words do not record a fixing, omit the record rather than fabricate evidence."

options:
  fields_for_search: [source, target, quote]

display:
  label: '{source} — {type} — {target}'
