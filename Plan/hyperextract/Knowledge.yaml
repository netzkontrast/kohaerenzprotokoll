# Knowledge — who knows, wrongly believes or cannot yet know what, and where, with the sentence.
#
# provisional — first design, 2026-09-30; never run on the corpus
# derived from: the plan's reader-knowledge ledger (Phase 2c: what the reader, Kael and AEGIS each know, wrongly believe and cannot yet know), GOAL.md 4.3
#   (`ReaderKnowledgeState`, edge `knows_at`) and 5.5's information balance (knows for certain, wrongly assumes, cannot yet know, learns here,
#   misreads afterwards). The continuity-editor's knowledge state and the beta-reader-panel's comparison with the treatment read the same thing.
# measured against: the reader-knowledge lines the treatment will hold once it exists; until then, a record whose knower and fact stand inside its quote is the precise subset. A quote is placed by read.py --find (P26).
# may not: say what the reader will know, or that a reveal has landed — the beta-reader-panel measures that against readers — or decide which document's knowledge state is right; a state here is a P_HE_KNOWS candidate
# retire when: on three documents a person keeps no state beyond what the plan's reader-knowledge lines will hold
language: en
name: Knowledge
type: list
tags: [knowledge-state, reader, reveals, continuity, german]
description: "Who knows, wrongly believes or cannot yet know what, and where, with the sentence, each copied from one German document."

output:
  description: "One record per sentence that states it."
  fields:
    - name: source
      type: str
      description: "Who knows: the reader, or a figure, or a system, exactly as the source names it."
      required: true
    - name: target
      type: str
      description: "The fact, as a short phrase exactly as the source writes it."
      required: true
    - name: type
      type: str
      description: "knows: for certain. wrongly_believes: takes it to be so and is wrong. cannot_yet_know: has no way to know it yet. learns_here: comes to know it at this point. misreads_after: will read it wrongly afterwards. suspects: has a well-founded doubt. should_feel: the source says the reader is meant to feel it here."
      required: true
    - name: quote
      type: str
      description: "Exact contiguous words from ONE source line, containing BOTH names; no ellipsis, joined lines or translation. Prefer a shorter fragment if a sentence wraps."
      required: true
    - name: stance
      type: str
      description: "asserts: states it as so. hedges: qualifies it as possible or provisional. denies: says it is not so. asks: poses it as a question. cites: reports what an outside source says."
      required: true

guideline:
  target: "You read one German plan or analysis of a novel and collect, verbatim, the sentences that say who knows, wrongly believes or cannot yet know what, so that a person can keep a ledger of the reader's knowledge beside each figure's."
  rules:
    - "Record a state only when ONE sentence gives the knower, the fact and the state: weiß, weiß nicht, glaubt fälschlich, kann noch nicht wissen, erfährt, ahnt, missversteht, der Leser, der Leser soll, Informationsbilanz."
    - "The knower and the fact both stand inside the quote."
    - "What the reader is meant to know or feel is recorded with the reader as the source, and the type should_feel if it is an effect, not a fact."
    - "A state the source marks as planned or intended is recorded with stance hedges."
    - "Never infer what a figure knows from what it does, or what the reader knows from what a figure says."
    - "When the words do not give the state, omit the record rather than fabricate evidence."

options:
  fields_for_search: [source, target, quote]

display:
  label: '{source} — {type} — {target}'
