# Precedence — what the document puts before or after what — phases, steps, chapters, events — with the sentence.
#
# provisional — first design, 2026-09-30; never run on the corpus
# derived from: the wiki's chapters and plot pages (decision 013), whose order is the unit of the novel, and the phase and act structures the
#   plans give differently; the stated graph has no ordering relation between terms or events.
# measured against: the order the chapter pages and `Wiki/overview/plot.md` give; a pair whose endpoints resolve to a wiki term or a chapter is the attachable subset. A quote is placed by read.py --find (P26).
# may not: build a timeline, reconcile two documents' orders, or say a plan and a draft disagree — an order is a P_HE_BEFORE proposal for a reader
# retire when: on three documents a person keeps no order beyond what the chapter pages already give
language: en
name: Precedence
type: list
tags: [order, sequence, phases, plot, german]
description: "What the document puts before or after what — phases, steps, chapters, events — with the sentence, each copied from one German document."

output:
  description: "One record per sentence that states it."
  fields:
    - name: source
      type: str
      description: "The earlier item, phase, step, chapter or event, as a short phrase exactly as the document writes it."
      required: true
    - name: target
      type: str
      description: "The later item, exactly as the document writes it."
      required: true
    - name: type
      type: str
      description: "before: the first comes earlier than the second. during: the first happens within the second. triggers_next: the first sets off the second directly. phase_of: the first is a numbered phase, act or stage of the second. simultaneous: they happen together."
      required: true
    - name: quote
      type: str
      description: "Exact contiguous words from ONE source line, containing BOTH names; no ellipsis, joined lines or translation. Prefer a shorter fragment if a sentence wraps."
      required: true
    - name: stance
      type: str
      description: "asserts: states it as so. hedges: qualifies it as possible or provisional. denies: says it is not so. asks: poses it as a question. cites: reports what an outside source says."
      required: true

guideline:
  target: "You read one German research document and collect, verbatim, the sentences that put one thing before or after another, so that a person can see the order the document gives."
  rules:
    - "Record a pair only when ONE sentence states the order: vor, nach, zuerst … dann, danach, anschließend, folgt auf, geht voraus, in Phase, bevor, sobald, or numbered steps that one sentence introduces."
    - "Both items stand inside the quote and are short phrases of at most six words; a chapter is written as the document writes it."
    - "Numbered chapters, acts or phases are recorded with phase_of; two chapters in a list are recorded once, not once per neighbour."
    - "Never infer an order from a numbering the sentence does not state, from a date in a title, or from background knowledge."
    - "When the words do not state an order, omit the record rather than fabricate evidence."

options:
  fields_for_search: [source, target, quote]

display:
  label: '{source} — {type} — {target}'
