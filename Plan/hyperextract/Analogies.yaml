# Analogies — a term of the fictional world and the real concept the document says it corresponds to.
#
# provisional — first design, 2026-09-30; never run on the corpus
# derived from: the wiki's readings of borrowed concepts (the census's `lens` sections, written by hand for every document) and the
#   questions a hard-SF novel keeps asking: which real physics, mathematics or psychology stands behind a fictional name.
#   StatedRelations records relations inside the fictional world only and drops a comparison with an outside work.
# measured against: the `lens` lists of the censuses and the borrowed concepts named in the note of the same document; a pair whose quote holds both names is the precise subset. A quote is placed by read.py --find (P26).
# may not: say the fiction is right about the science, or merge a fictional term with a real one; a pair is a P_HE_ANALOGY proposal for a reader
# retire when: on three documents a person keeps no pair beyond the census's own lens list
language: en
name: Analogies
type: list
tags: [analogy, borrowed-concepts, science, german]
description: "A term of the fictional world and the real concept the document says it corresponds to, each copied from one German document."

output:
  description: "One record per sentence that states it."
  fields:
    - name: source
      type: str
      description: "Exactly as the document writes it: the term of the fictional world (a name, a mechanism, a place, a system)."
      required: true
    - name: target
      type: str
      description: "Exactly as the document writes it: the real-world concept, theory, law, author or field it is set beside."
      required: true
    - name: type
      type: str
      description: "models: the fictional term is a model of the concept. metaphor_for: the document calls it a metaphor or image of it. based_on: the document says it is built on or derived from it. implements: it puts the concept to work. corresponds_to: the document maps one onto the other without saying more."
      required: true
    - name: quote
      type: str
      description: "Exact contiguous words from ONE source line, containing BOTH names; no ellipsis, joined lines or translation. Prefer a shorter fragment if a sentence wraps."
      required: true
    - name: stance
      type: str
      description: "asserts: states it as so. hedges: qualifies it as possible or provisional. denies: says it is not so. asks: poses it as a question. cites: reports what an outside source says."
      required: true

guideline:
  target: "You read one German research document and collect, verbatim, the sentences in which it maps a term of the novel's world onto a real concept, so that a person can see which science or theory stands behind which name."
  rules:
    - "Record a pair only when ONE sentence maps the two: entspricht, analog zu, Metapher für, basiert auf, modelliert, steht für, verkörpert, angelehnt an, nach dem Vorbild, or a table row that sets a fictional term beside a real one."
    - "The source is a term of the fictional world and the target a real concept, method, law, author or field. A pair of two fictional terms, or of two real ones, is not recorded."
    - "Both names must stand inside the quote. A name that only appears near the quote is not recorded."
    - "A mapping the document attributes to another source is recorded with stance cites; a mapping it doubts, with stance hedges."
    - "Never infer a mapping from resemblance, from two passages, or from background knowledge."
    - "When the words do not map the one onto the other, omit the record rather than fabricate evidence."

options:
  fields_for_search: [source, target, quote]

display:
  label: '{source} — {type} — {target}'
