# Page kinds of the research wiki — the single contract for tools/kpwiki,
# scripts/wiki_lint.py and scripts/render_wiki_views.py. Change here, never in
# code (concept §3.2; AutoSci schema-as-contract). tools/kpwiki/schema.py builds
# its Pydantic Literals from these enums at import time; tests/test_wiki_schema.py
# guards the derivation.
version: 1

lifecycle:
  field: status
  initial: draft
  states: [draft, reviewed, contested, superseded, archived]
  transitions:
    draft: [reviewed, archived]
    reviewed: [contested, superseded, archived]
    contested: [reviewed, superseded, archived]
    superseded: [archived]
    archived: []
  # A reviewed page is authoritative: a new source never overwrites it, it flags it (synthadoc RULE 1b).
  protected: [reviewed]
  # Everything an LLM wrote and no human has reviewed lives here until /wiki-promote moves it.
  candidates_dir: Wiki/candidates
  archive_cascade: rewrite every [[slug]] link to an archived page as plain text with a note

enums:
  tier: [T0-duplicate, T1-superseded, T2-theory, T3-work, T4-out-of-scope]
  category: [kernkonzept, plot-outline, charaktere, worldbuilding, storyform, audit,
             theorie-mathematik, theorie-logik, theorie-physik, theorie-psychologie,
             theorie-philosophie, theorie-genre, aegis, unzugeordnet]
  language: [de, en, mixed]
  confidence: [high, medium, low]
  canon_relation: [consistent, extends, contradicts, unrelated, unknown]
  # unverified is the initial value of every Canon claim inside the wiki loop (D-W12);
  # locked means present in Canon with [K] AND checked against the populated wiki.
  canon_status: [unverified, locked, proposal, absent, contradicted, promoted]
  kind_detail: [concept, character, world, rule, theory, motif, storyform]
  axis: [incompleteness, incorrectness, redundancy]
  question_status: [open, answered, escalated, parked]
  concept_table_status: [high-confidence, single-source, tentative, contradicted]
  evidence_grade: [HIGH, MEDIUM, LOW]
  context_scope: [global, act-1, act-2, act-3, chapter]
  context_priority: [core, supporting, evidence]
  # The contradiction ledger. `subject_kind` gives it two trees: one keyed by
  # concept, one by named entity, so a clash about Kael is findable both through
  # the concept it surfaced in and through Kael himself.
  subject_kind: [concept, entity]
  ledger_status: [open, all-resolved]

kinds:
  source:
    dir: Wiki/sources
    partition_by: category
    page_budget: {ideal_words: 350, warn_words: 700, max_words: 1000}
    one_per: Drive document of tier T1, T2 or T3 (T4 is never ingested, D-W9)
    template: Wiki/templates/source.md.tmpl
    required: [title, kind, slug, drive_id, tier, category, language, status, sha256, ingested]
    optional: [supersedes, superseded_by, truncated, aliases, tags, title_truncated]
    fields:
      kind: {const: source}
      tier: {enum: tier}
      category: {enum: category}
      language: {enum: language}
      status: {lifecycle: true}
      sha256: {pattern: "^[0-9a-f]{64}$", of: Sources/drive/<slug>.md at ingest time}
      ingested: {format: date}
      truncated: {type: bool, default: false}
      supersedes: {ref: source}
      superseded_by: {ref: source}
    sections: [Summary, Key claims, Entities, Canon relation, Open questions, Log]
    rules:
      - every item under Key claims carries a ^[Sources/drive/<slug>.md:L-L] citation whose quote is in those lines
      - a T1-superseded source never raises a question alone (D-W6)
      - never emits the [K] marker

  concept:
    dir: Wiki/concepts
    partition_by: kind_detail
    page_budget: {ideal_words: 500, warn_words: 900, max_words: 1300}
    one_per: merged idea, entity, rule, theory or motif across sources
    template: Wiki/templates/concept.md.tmpl
    required: [title, kind, slug, kind_detail, status, confidence, sources, canon_status,
               context_summary, context_scope, context_priority, chapter_start, chapter_end, spoiler_until]
    optional: [aliases, codex_ref, canon_ref, tags, disagreements, table_status, ingested,
               contradiction_ref]
    fields:
      kind: {const: concept}
      kind_detail: {enum: kind_detail}
      status: {lifecycle: true}
      confidence: {enum: confidence, requires: evidence}
      sources: {list_of_ref: source, min: 1}
      canon_status: {enum: canon_status, initial: unverified}
      context_summary: {type: str, max_words: 40}
      context_scope: {enum: context_scope}
      context_priority: {enum: context_priority}
      chapter_start: {type: int, min: 0, max: 40}
      chapter_end: {type: int, min: 0, max: 40}
      spoiler_until: {type: int, min: 0, max: 40}
      # What the merged sources currently support, as the concept table reads it;
      # contradicted while any disagreement is pending. The lifecycle field above
      # stays draft/reviewed/… — this is the evidence state, not the review state.
      table_status: {enum: concept_table_status}
      # Topics only — the contested statements themselves are never on this page.
      # A reader follows contradiction_ref to the ledger for positions and sources.
      disagreements: {list_of: str}
      contradiction_ref: {pattern: "^Wiki/(candidates/)?contradictions/concept/[a-z0-9-]+\\.md$"}
      # When /research-ingest drafted the candidate; the lint dates candidate-age by it.
      ingested: {format: date}
      codex_ref: {pattern: "^codex:[a-z0-9-]+$", terminal: true}
      canon_ref: {pattern: "^canon:[^#]+#.+$", terminal: true}
    sections: [Definition, What Canon says, Where sources agree, Timeline of the idea, Open questions]
    rules:
      - every sentence under Definition carries at least one citation
      - "every disagreement is recorded in the ledger at Wiki/**/contradictions/concept/<slug>.md with at least two sources and a resolution (pending, supersedes or both-valid), never on this page"
      - the section What Canon says quotes Canon verbatim in German and never emits [K]
      - "status contested is required while any disagreement is pending, and the page then carries contradiction_ref"
      - "the body asserts only what the sources agree on: no contradictory statement is ever rendered onto a concept page"

  # The contradiction ledger: what the wiki knows has ever been disputed.
  # One file per subject, append-only, and deliberately not a page anyone reads
  # for the answer — it is the memory that lets a later document be checked
  # against a clash found long before it arrived.
  contradiction:
    dir: Wiki/contradictions
    partition_by: subject_kind
    page_budget: {ideal_words: 400, warn_words: 1200, max_words: 2500}
    one_per: concept or entity that has ever carried a contradiction
    template: Wiki/templates/contradiction.md.tmpl
    required: [title, kind, slug, subject_kind, subject, status, first_seen, last_seen,
               open_count, total_count]
    optional: [concepts, entities, question_refs, tags]
    fields:
      kind: {const: contradiction}
      subject_kind: {enum: subject_kind}
      subject: {type: str, of: the concept slug or the entity name this ledger belongs to}
      status: {enum: ledger_status}
      first_seen: {format: date}
      last_seen: {format: date}
      open_count: {type: int, min: 0, of: disagreements whose resolution is still pending}
      total_count: {type: int, min: 1, of: disagreements ever recorded here}
      concepts: {list_of_ref: concept}
      question_refs: {list_of_ref: question}
      entities: {list_of: str}
    sections: [Subject, Open contradictions, Resolved contradictions, How this ledger is used]
    rules:
      - "append-only: a recorded contradiction is never deleted or rewritten, only moved from Open to Resolved with the resolution that settled it"
      - every contradiction names at least two sources and one position per source, each cited
      - "a ledger is evidence, not a verdict: it records that sources disagree and never decides which is right"
      - an open contradiction carries a question_ref, so it sits on a worklist and not only in memory
      - "page budget is generous by design: a ledger grows with the corpus and is never split for length"

  question:
    dir: Wiki/questions
    partition_by: axis
    page_budget: {ideal_words: 250, warn_words: 500, max_words: 750}
    one_per: open question about our understanding of the novel
    template: Wiki/templates/question.md.tmpl
    required: [title, kind, slug, axis, status, concepts, evidence, owner,
               context_summary, context_scope, context_priority, chapter_start, chapter_end, spoiler_until]
    optional: [decision_ref, tetraframe_run, revisit, tags]
    fields:
      kind: {const: question}
      axis: {enum: axis}
      status: {enum: question_status}
      concepts: {list_of_ref: concept, min: 1}
      evidence: {list_of: citation, min: 1, graded: evidence_grade}
      owner: {enum: [author, session, graph]}
      context_summary: {type: str, max_words: 40}
      context_scope: {enum: context_scope}
      context_priority: {enum: context_priority}
      chapter_start: {type: int, min: 0, max: 40}
      chapter_end: {type: int, min: 0, max: 40}
      spoiler_until: {type: int, min: 0, max: 40}
      decision_ref: {pattern: "^D-[A-Z]?[0-9]+$"}
      tetraframe_run: {pattern: "^Plan/decisions/tetraframe/.+\\.json$"}
      revisit: {format: date}
    sections: [Question, Evidence, What Canon says, Candidate answers, Resolution]
    rules:
      - status escalated requires decision_ref
      - status parked requires revisit
      - a question that would supersede, merge or contradict a reviewed page cites a tetraframe_run before it is escalated

  synthesis:
    dir: Wiki/syntheses
    partition_by: filed_year
    page_budget: {ideal_words: 700, warn_words: 1200, max_words: 1800}
    one_per: filed /query answer that drew on three or more pages
    template: Wiki/templates/synthesis.md.tmpl
    required: [title, kind, slug, query, sources, status, filed,
               context_summary, context_scope, context_priority, chapter_start, chapter_end, spoiler_until]
    optional: [tags]
    fields:
      kind: {const: synthesis}
      query: {type: str}
      sources: {list_of_ref: [source, concept, question], min: 3}
      status: {lifecycle: true}
      filed: {format: date}
      context_summary: {type: str, max_words: 40}
      context_scope: {enum: context_scope}
      context_priority: {enum: context_priority}
      chapter_start: {type: int, min: 0, max: 40}
      chapter_end: {type: int, min: 0, max: 40}
      spoiler_until: {type: int, min: 0, max: 40}
    sections: [Question, Answer, Sources, Gaps]
    rules:
      - every claim in the section Answer cites a wiki page as [[slug]]
      - the section Gaps is present and may be empty only when the answer draws on five or more pages

markers:
  # Research pages may quote [K]/[V] text from Canon but never emit [K] themselves.
  forbidden_outside_canon: ["[K]"]
  allowed_quoted: ["[K]", "[V]", "[L]"]

citation:
  pattern: "\\^\\[(?P<file>Sources/drive/[a-z0-9-]+\\.md|Canon/[^:\\]]+):(?P<start>\\d+)(?:-(?P<end>\\d+))?\\]"
  rule: the file exists, 1 <= start <= end <= number of lines, and the quoted fragment is in those lines
