[project]
name = "novelgraph"
version = "0.1.0"
description = "File-based chunk and vector index over Sources/, with line-level provenance"
requires-python = ">=3.10"
dependencies = [
    "model2vec==0.6.0",
    "numpy>=1.26",
    "simplemma==1.1.2",
]

[project.scripts]
novelgraph = "novelgraph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novelgraph"]
