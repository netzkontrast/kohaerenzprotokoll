[project]
name = "novelgraph"
version = "0.1.0"
description = "File-based chunk and vector index over Sources/, with line-level provenance"
requires-python = ">=3.11"
dependencies = [
    "model2vec==0.6.0",
    "numpy>=1.26",
    "simplemma==1.1.2",
]

[project.optional-dependencies]
# the RLM retrieval agent (`novelgraph rlm`): DSPy's sandboxed REPL over this index, pinned to the
# version .venv-dspy runs (scripts/install.sh dspy), so lmrun.py and claude_lm.py behave the same here
rlm = ["dspy[deno]==3.3.1"]

[project.scripts]
novelgraph = "novelgraph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novelgraph"]
